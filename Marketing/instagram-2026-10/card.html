<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FavCircles Instagram card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  /* 1080 × 1350 (Instagram portrait). ?id=<post id> picks the post from posts.json.
     The real app screenshot sits in an iPhone frame rising from the bottom edge. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #0E2A47; font-family: Inter, -apple-system, sans-serif; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff;
    background:
      radial-gradient(90% 60% at 50% 100%, rgba(255,255,255,.22), rgba(255,255,255,0) 70%),
      radial-gradient(70% 50% at 0% 0%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%),
      linear-gradient(165deg, var(--a), var(--b)); }
  .top { position: absolute; left: 80px; right: 80px; top: 70px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 60px; height: 60px; border-radius: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .brand b { font-size: 32px; font-weight: 800; letter-spacing: -.3px; }
  .brand span { margin-left: auto; font-size: 24px; font-weight: 600; opacity: .85; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; margin-top: 52px; padding: 10px 22px 10px 16px; border-radius: 999px;
    background: rgba(255,255,255,.18); font-size: 30px; font-weight: 700; }
  .kicker i { font-style: normal; font-size: 34px; }
  h1 { margin-top: 24px; font-size: 76px; line-height: 1.04; font-weight: 800; letter-spacing: -2px; text-wrap: balance; }
  h1.long { font-size: 64px; }
  /* iPhone: black titanium-ish bezel around the real screenshot */
  .phone { position: absolute; left: 50%; top: var(--phone-top, 520px); width: 600px; transform: translateX(-50%);
    padding: 14px; border-radius: 86px; background: linear-gradient(145deg, #3a3a3e, #121214 40%, #2a2a2e);
    box-shadow: 0 40px 80px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.08) inset; }
  .phone img { display: block; width: 572px; border-radius: 72px; }
  .shadow { position: absolute; left: 50%; bottom: 0; width: 760px; height: 120px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(0,0,0,.25), rgba(0,0,0,0)); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <div class="brand"><img src="favcircles-icon.png" alt=""><b>FavCircles</b><span>Free on the App Store</span></div>
    <div class="kicker"><i id="emoji"></i><span id="kicker"></span></div>
    <h1 id="headline"></h1>
  </div>
  <div class="phone" id="phone"><img id="shot" alt=""></div>
</div>
<script>
  function darker(hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => Math.round(v * 0.55).toString(16).padStart(2, '0');
    return '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255);
  }
  const id = new URLSearchParams(location.search).get('id');
  fetch('posts.json').then((r) => r.json()).then(({ posts }) => {
    const p = posts.find((x) => x.id === id) || posts[0];
    const card = document.getElementById('card');
    card.style.setProperty('--a', p.accent);
    card.style.setProperty('--b', darker(p.accent));
    document.getElementById('emoji').textContent = p.emoji;
    document.getElementById('kicker').textContent = p.kicker;
    const h = document.getElementById('headline');
    h.textContent = p.headline;
    if (p.headline.length > 34) h.className = 'long';
    const img = document.getElementById('shot');
    img.src = `shots/${p.shot}.jpg`;
    return Promise.all([document.fonts.ready, img.decode().catch(() => {})]);
  }).then(() => {
    // The phone starts a little below the headline, however many lines it took
    const top = document.querySelector('.top').getBoundingClientRect().bottom;
    document.getElementById('card').style.setProperty('--phone-top', Math.max(470, Math.round(top + 56)) + 'px');
    document.body.dataset.fits = top + 56 <= 640 ? 'yes' : 'no:' + Math.round(top);
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
