<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1800px; height: 1200px; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #173a6b 0%, #3182CE 78%, #4fa3e3 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* soft glow behind the icon */
  .glow {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 62%);
    left: 130px; top: 150px;
  }
  /* scattered map pins */
  .pin { position: absolute; opacity: 0.28; }
  .content { display: flex; align-items: center; gap: 110px; z-index: 2; padding: 0 140px; }
  .icon {
    width: 460px; height: 460px; border-radius: 102px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.35), 0 0 0 10px rgba(255,255,255,0.25);
  }
  .text { max-width: 900px; }
  h1 {
    color: #fff; font-size: 118px; font-weight: 800; line-height: 1.06;
    letter-spacing: -2px; margin-bottom: 44px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.25);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 22px;
    background: #ffd640; color: #17325a;
    font-size: 62px; font-weight: 700;
    padding: 26px 54px; border-radius: 70px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    margin-bottom: 46px;
  }
  .sub {
    color: rgba(255,255,255,0.92); font-size: 52px; font-weight: 500; line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div style="position:absolute; right:-90px; top:-90px; width:420px; height:420px; border-radius:50%; border:60px solid rgba(255,255,255,0.07);"></div>
  <div style="position:absolute; left:-120px; bottom:-140px; width:520px; height:520px; border-radius:50%; border:70px solid rgba(255,255,255,0.06);"></div>

  <div class="content">
    <img class="icon" src="file:///Users/wesleysgroi/circles-app/ios/iOS_App_Icon_1024x1024.png">
    <div class="text">
      <h1>Sign up &amp; earn rewards here</h1>
      <div class="pill">🎁&nbsp; 100 free points</div>
      <div class="sub">Join FavCircles in seconds — your points are waiting at the counter.</div>
    </div>
  </div>
</body>
</html>
