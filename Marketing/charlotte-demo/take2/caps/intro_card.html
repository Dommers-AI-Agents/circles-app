<!doctype html><meta charset=utf8><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:900px;height:1956px;background:transparent}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;
background:linear-gradient(180deg,rgba(9,20,34,.72) 0%,rgba(9,20,34,.22) 30%,rgba(9,20,34,.22) 70%,rgba(9,20,34,.76) 100%)}
.panel{background:rgba(14,42,71,.86);border:2px solid rgba(79,209,197,.45);border-radius:44px;padding:78px 66px 84px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.45);max-width:780px}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:150px;height:150px;margin-bottom:44px}
.logo span{border-radius:50%;background:#63B3ED}.logo span:nth-child(1),.logo span:nth-child(4){background:#4FD1C5}
h1{font-size:96px;font-weight:800;letter-spacing:-2px;color:#fff}h1 .fav{color:#4FD1C5}
p{font-size:44px;color:#DCE6F2;margin-top:30px;font-weight:600;max-width:640px;line-height:1.35}
</style><div class=panel>
<div class=logo><span></span><span></span><span></span><span></span></div>
<h1><span class=fav>Fav</span>Circles</h1><p>Your saved places, and your friends, on your map</p></div>
