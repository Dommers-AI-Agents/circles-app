<!doctype html><html><head><meta charset="utf-8"><title>Reserved table tent</title>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,700;1,700&amp;family=Figtree:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A365D}a:hover{color:#111317}
</style>
</head><body>

<div style="width: 560px; height: 760px; background: #ECE7DC; box-sizing: border-box; padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; align-items: center; font-family: 'Figtree', 'Avenir Next', sans-serif">
<div style="width: 520px; height: 335px; background: #FFFBF0; box-shadow: 0 12px 26px rgba(0,0,0,0.2); box-sizing: border-box; padding: 18px; display: flex">
<div style="flex: 1 1 auto; border: 2px solid #1A365D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative">
<div style="position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px; border: 1px solid #1A365D; opacity: 0.5"></div>
<div style="font-size: 12px; letter-spacing: 5px; color: #1A365D; font-weight: 700">— FRONT —</div>
<div style="font-family: 'Gelasio', Georgia, serif; font-weight: 700; color: #1A365D; font-size: 66px; letter-spacing: 4px; line-height: 1">RESERVED</div>
<div style="font-family: 'Gelasio', Georgia, serif; font-style: italic; font-weight: 700; color: #B8860B; font-size: 26px">for your regulars</div>
<div style="font-size: 13px; color: #4A5563; margin-top: 6px">Every regular was a stranger once.</div>
</div>
</div>
<div style="width: 520px; height: 335px; background: #1A365D; box-shadow: 0 12px 26px rgba(0,0,0,0.3); box-sizing: border-box; padding: 28px 30px; display: flex; gap: 24px; align-items: center">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 11px; letter-spacing: 3px; color: #F6C945; font-weight: 700">— BACK —</div>
<div style="font-family: 'Gelasio', Georgia, serif; font-weight: 700; color: #ffffff; font-size: 25px; line-height: 1.15">How a stranger becomes a regular:</div>
<div style="display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; color: #ffffff; line-height: 1.3">
<div><b style="color: #F6C945">They scan</b> your window sticker and save you.</div>
<div><b style="color: #F6C945">Their friends</b> see you in their circles.</div>
<div><b style="color: #F6C945">You bring them back</b> with points and specials.</div>
</div>
<div style="font-size: 12px; color: #ffffff; opacity: 0.75">Your first 3 months are free.</div>
</div>
<div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px">
<img src="qr-store-owners.svg" alt="QR code to the FavCircles Store Owners page" style="width: 118px; height: 118px; display: block; border-radius: 8px">
<div style="font-size: 11px; font-weight: 700; color: #ffffff; letter-spacing: 1px">FOR OWNERS</div>
</div>
</div>
</div>
</body></html>
