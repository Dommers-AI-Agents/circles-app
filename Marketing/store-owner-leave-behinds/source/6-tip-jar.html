<!doctype html><html><head><meta charset="utf-8"><title>Tip jar</title>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@700&amp;family=Figtree:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A365D}a:hover{color:#111317}
</style>
</head><body>

<div style="width: 460px; height: 700px; background: #ECE7DC; box-sizing: border-box; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 22px; font-family: 'Figtree', 'Avenir Next', sans-serif">
<div style="display: flex; flex-direction: column; align-items: center">
<div style="width: 200px; height: 26px; background: #8A7F6A; border-radius: 6px 6px 2px 2px"></div>
<div style="width: 170px; height: 14px; background: #D9E4EA; opacity: 0.9"></div>
<div style="width: 270px; height: 330px; background: #D9E4EA; border-radius: 22px 22px 40px 40px; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.7), 0 12px 24px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; position: relative">
<div style="position: absolute; left: 22px; top: 20px; width: 14px; height: 250px; border-radius: 10px; background: #ffffff; opacity: 0.55"></div>
<div style="width: 214px; background: #111317; border-radius: 8px; padding: 18px 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="font-size: 10px; letter-spacing: 3px; color: #F6C945; font-weight: 700">TIPS</div>
<div style="font-family: 'Gelasio', Georgia, serif; font-weight: 700; color: #ffffff; font-size: 21px; line-height: 1.12">The best tip a customer can leave?</div>
<div style="font-family: 'Gelasio', Georgia, serif; font-weight: 700; color: #F6C945; font-size: 21px; line-height: 1.12">Telling a friend.</div>
</div>
</div>
</div>
<div style="width: 400px; background: #FFFBF0; border-radius: 12px; box-shadow: 0 8px 18px rgba(0,0,0,0.12); padding: 16px 18px; box-sizing: border-box; display: flex; gap: 14px; align-items: center">
<div style="flex: 1 1 auto; font-size: 13px; color: #111317; line-height: 1.42"><b>FavCircles makes that tip easy.</b> One scan saves your shop to their circle. When they bring a friend in, both earn the points you choose.</div>
<img src="qr-store-owners.svg" alt="QR code to the FavCircles Store Owners page" style="flex: 0 0 auto; width: 84px; height: 84px; display: block; border-radius: 6px">
</div>
</div>
</body></html>
