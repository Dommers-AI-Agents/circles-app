<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moment on Circles - Share Your Favorite Places</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Moment on Circles">
    <meta property="og:description" content="Watch this moment from a favorite place on Circles">
    <meta property="og:image" content="https://api.favcircles.com/images/circles-preview.png">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Moment on Circles">
    <meta name="twitter:description" content="Watch this moment from a favorite place on Circles">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            margin-top: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 20px 0;
        }

        .app-logo h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .thumb-wrap {
            position: relative;
            background: #111;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb-wrap img {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            display: block;
        }

        .play-badge {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #667eea;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .moment-info {
            padding: 20px;
        }

        .moment-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .moment-meta {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #f2f2f7;
            color: #333;
        }

        .unavailable {
            text-align: center;
            padding: 40px 20px;
        }

        .unavailable .emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .unavailable h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .unavailable p {
            color: #666;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="app-logo">
                <h1>Circles</h1>
            </div>
            <div id="content">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading moment...</p>
                </div>
            </div>
        </div>
    </div>
    <script src="/public/video-share.js" defer></script>
</body>
</html>
